# Governed sql producers over the realm's provisioned store — MINED, then curated.
# All GENERATED SELECTs (no authored SQL anywhere): governance compiles into the statement.
# mode stays OPEN with the full column lists pre-written under expose:, so governing a
# deployment is pruning lines and flipping one keyword. The register changes once a year
# (first business day of February), so a day of cache is conservative.

# The query anchor's resolver — a name pinned on a DonationQuery becomes its entity row.
- name: entitiesByName
  kind: sql
  datasource: au_donations
  table: entities
  keyColumn: name
  dialect: postgresql
  governance:
    mode: open
    expose:
      entities:
        properties: [id, name, abn, acn]
  cache: { kind: ttl, seconds: 86400 }

- name: returnsByEntityId
  kind: sql
  datasource: au_donations
  table: returns
  keyColumn: entity_id
  dialect: postgresql
  governance:
    mode: open
    expose:
      returns:
        properties: [id, entity_id, financial_year, return_type, total_receipts, total_payments,
                     total_debts, total_donations_made, total_donations_received, electoral_expenditure]
  cache: { kind: ttl, seconds: 86400 }

