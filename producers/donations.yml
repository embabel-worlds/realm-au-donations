- name: "debtsByCreditorId"
  kind: "sql"
  datasource: "au_donations"
  table: "debts"
  keyColumn: "creditor_id"
  governance:
    mode: "open"
    expose:
      debts:
        properties:
        - "id"
        - "debtor_id"
        - "creditor_id"
        - "financial_year"
        - "amount"
        - "institution_type"
