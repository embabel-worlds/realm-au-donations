- name: "Debt"
  visibility: "internal"
  description: "Row of debts (mined from the relational schema; identity = id)."
  properties:
    id:
      metadata:
        identity: "true"
    debtor_id: "int4, not null column of debts."
    creditor_id: "int4, not null column of debts."
    financial_year: "text, not null column of debts."
    amount: "numeric column of debts."
    institution_type: "text column of debts."
  virtualJoins:
  - anchorLabel: "Entity"
    relationship: "HAS_DEBTS"
    keyField: "id"
    recordKeyField: "creditor_id"
    producer: "debtsByCreditorId"
    description: "Rows of debts for a Entity, keyed by creditor_id (mined from the\
      \ FK to entities.id)."
  - anchorLabel: "Entity"
    relationship: "HAS_DEBTS"
    keyField: "id"
    recordKeyField: "debtor_id"
    producer: "debtsByDebtorId"
    description: "Rows of debts for a Entity, keyed by debtor_id (mined from the FK\
      \ to entities.id)."
